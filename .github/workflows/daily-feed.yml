# Builds the OTC Pulse daily snapshot and publishes it to the `feed` branch,
# where the app fetches it from:
#   https://raw.githubusercontent.com/psnIOjnb/fuzzy-octo-doodle/refs/heads/feed/daily.json
#
# The snapshot covers the previous 24 hours. The generator keeps a small
# state file (feed-state.json) on the `feed` branch recording the last run
# and a first-seen index for regulators whose RSS carries no per-item dates;
# that is what makes a strict 24-hour window safe.
#
# NOTE: scheduled workflows only run from the repository's DEFAULT branch,
# so this file must be on main for the cron to fire. Use the "Run workflow"
# button (workflow_dispatch) to run it on demand at any time.

name: Daily OTC Pulse feed

on:
  schedule:
    # 20:30 UTC daily — after US market hours, before the Asian morning.
    - cron: "30 20 * * *"
  workflow_dispatch:
    inputs:
      hours:
        description: "Snapshot window in hours (24 = previous day; 720 ≈ 30-day backfill)"
        required: false
        default: "24"

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install feedparser python-dateutil

      - name: Check out the feed branch (carries daily.json + state)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          REPO_URL="https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          # Reuse the existing feed branch (keeps daily history and the
          # first-seen state) or start one from scratch.
          if git ls-remote --exit-code "$REPO_URL" refs/heads/feed >/dev/null 2>&1; then
            git clone --depth 1 --branch feed "$REPO_URL" publish
          else
            mkdir publish
            git -C publish init -b feed
            git -C publish remote add origin "$REPO_URL"
          fi

      - name: Generate the daily snapshot
        # The window widens automatically if the previous run was more than
        # `hours` ago, so cron drift can never drop publications.
        run: |
          python feedgen/generate_feed.py \
            --hours "${{ github.event.inputs.hours || '24' }}" \
            --out publish/daily.json \
            --state publish/feed-state.json

      - name: Publish to the feed branch
        run: |
          set -euo pipefail
          mkdir -p publish/history
          cp publish/daily.json "publish/history/$(date -u +%F).json"

          cd publish
          git config user.name "otc-pulse-feed[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feed: $(date -u +%FT%TZ)" || { echo "No changes to publish"; exit 0; }
          git push origin feed
